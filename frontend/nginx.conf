server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routes (e.g. /projects/:id) must resolve to
    # index.html, not a 404, since there's no matching file on disk for them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's default) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
