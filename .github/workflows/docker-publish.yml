name: Build and push Docker images

# Builds happen here (GitHub's runners) because the VPS deploy path only
# fetches docker-compose.yaml, not the repo - there is no source tree on the
# VPS for a `build:` context to compile against. Pushing pre-built images to
# GHCR and having compose reference them by tag is what makes that work.
on:
  push:
    branches: [master, feat/dynamic-rbac]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/aspcv-crm-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # VITE_API_URL is baked into the JS bundle at build time - a repo
          # secret rather than the deploy .env, since this build happens on
          # GitHub, not on the VPS.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.aspcvcrm.tech/api' }}
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/aspcv-crm-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
